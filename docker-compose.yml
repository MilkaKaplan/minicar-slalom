# Two-container ROS 2 Jazzy pipeline: slalom between posts, iPhone LiDAR version.
#   docker compose --profile lidar up --build --exit-code-from lidar_processing lidar_replay lidar_processing
# Container 1 replays the recording (depth + confidence + phone pose), container 2 builds
# a 3D map, finds posts and wall WITHOUT track measurements, plans the slalom, compares it
# with the real drive and simulates a car. Results go to results/lidar/.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: "43"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  PYTHONUNBUFFERED: "1"

services:
  lidar_replay:
    build:
      context: .
      dockerfile: docker/Dockerfile.publisher
    image: minicar/publisher:lidar
    profiles: ["lidar"]
    environment: *ros-env
    volumes:
      - ./data:/data:ro
    networks: [ros]
    init: true            # helper process that forwards stop signals
    stop_signal: SIGINT   # send Ctrl+C, which ROS 2 handles cleanly
    command: ["/ros2_ws/install/minicar_publisher/lib/minicar_publisher/lidar_replay_node", "--ros-args",
              "-p", "recording_dir:=/data/lidar_drive", "-p", "every_nth:=2", "-p", "rate_hz:=30.0"]

  lidar_processing:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    image: minicar/processor:lidar
    profiles: ["lidar"]
    environment: *ros-env
    volumes:
      - ./data:/data:ro          # only for the optional hand measurements (accuracy report)
      - ./results:/results
    depends_on: [lidar_replay]
    networks: [ros]
    init: true
    stop_signal: SIGINT
    command: ["ros2", "launch", "/ros2_ws/lidar.launch.py"]

  # LiDAR dataset statistics for the README (not part of the pipeline, run on demand):
  #   docker compose run --rm stats
  stats:
    image: minicar/processor:lidar
    profiles: ["tools"]
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    working_dir: /work
    volumes:
      - .:/work:ro
      - ./docs:/work/docs
    command: ["python3", "/work/scripts/lidar_dataset_stats.py"]

networks:
  ros:
    driver: bridge