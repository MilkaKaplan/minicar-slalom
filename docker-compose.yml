# Two-container ROS 2 Jazzy pipeline: slalom between posts.
#   docker compose up --build --exit-code-from processor
# The processor writes its results to ./results and exits; compose then stops the publisher.
x-ros-env: &ros-env
  ROS_DOMAIN_ID: "43"
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
  PYTHONUNBUFFERED: "1"

services:
  publisher:
    build:
      context: .
      dockerfile: docker/Dockerfile.publisher
    image: minicar/publisher:jazzy
    environment: *ros-env
    volumes:
      - ./data:/data:ro
    networks: [ros]
    init: true            # helper process that forwards stop signals
    stop_signal: SIGINT   # send Ctrl+C, which ROS 2 handles cleanly

  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    image: minicar/processor:jazzy
    environment: *ros-env
    volumes:
      - ./results:/results
    depends_on: [publisher]
    networks: [ros]
    init: true
    stop_signal: SIGINT

  # ---------------------------------------------------------------------------
  # VIDEO VERSION (extra, not part of the main pipeline). Run it with:
  #   docker compose --profile video up --build --exit-code-from video_checker video_publisher video_checker
  # Container 1 streams the drive video as a front camera, container 2 finds the
  # posts on every frame. Results go to results/video/.
  video_publisher:
    build:
      context: .
      dockerfile: docker/Dockerfile.publisher
    image: minicar/publisher:jazzy
    profiles: ["video"]
    environment: *ros-env
    volumes:
      - ./data:/data:ro
    networks: [ros]
    init: true
    stop_signal: SIGINT
    command: ["/ros2_ws/install/minicar_publisher/lib/minicar_publisher/video_publisher_node", "--ros-args",
              "-p", "video_path:=/data/drive_video.mp4", "-p", "every_nth:=3", "-p", "rate_hz:=20.0"]

  video_checker:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    image: minicar/processor:jazzy
    profiles: ["video"]
    environment: *ros-env
    volumes:
      - ./results:/results
    depends_on: [video_publisher]
    networks: [ros]
    init: true
    stop_signal: SIGINT
    command: ["/ros2_ws/install/minicar_processor/lib/minicar_processor/video_checker_node", "--ros-args",
              "-p", "output_dir:=/results/video"]

  # Dataset statistics for the README (not part of the pipeline, run on demand):
  #   docker compose run --rm stats
  stats:
    image: minicar/processor:jazzy        # same image: has numpy, scipy, matplotlib, OpenCV
    profiles: ["tools"]                   # not started by "docker compose up"
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
    working_dir: /work
    volumes:
      - .:/work:ro
      - ./docs:/work/docs
    command: ["python3", "/work/scripts/dataset_stats.py"]

networks:
  ros:
    driver: bridge
